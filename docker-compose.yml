services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: employee_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: employee_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employee_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    image: employee-mgmt-container:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: employee_backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/employee_db
      SECRET_KEY: ${SECRET_KEY:-310059c7630a24653baab8b288e6e173c3a53c181018836829e7bac1aaca1222}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    depends_on:
      db:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:

